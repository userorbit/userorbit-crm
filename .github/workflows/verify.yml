name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.16'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx wrangler deploy --dry-run --outdir /tmp/crm-worker-build
