<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Userorbit profile capture</title>
<style>
body{font:14px system-ui;margin:20px;width:340px;color:#172554;background:#fff}h1{font-size:20px}p{line-height:1.5}label{display:block;margin-top:12px;font-weight:600}input{box-sizing:border-box;width:100%;padding:9px;margin-top:4px;border:1px solid #94a3b8;border-radius:5px}button{margin-top:18px;padding:10px 14px;background:#1d4ed8;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#status{white-space:pre-wrap}small{display:block;margin-top:8px;color:#475569}
</style></head>
<body><h1>Save a LinkedIn profile</h1><p>Review these details before saving to your private network review queue. This does not send a message or create a CRM contact.</p>
<form id="capture">
<label>CRM origin<input id="origin" type="url" placeholder="https://crm.example.com" required></label>
<label>Workspace ID<input id="workspace" required autocomplete="off"></label>
<label>Workspace API token<input id="token" type="password" required autocomplete="off"></label>
<small>The token is used for this save only and is never stored.</small>
<label>LinkedIn profile URL<input id="url" type="url" required readonly></label>
<label>Name<input id="name" required maxlength="200"></label>
<label>Company (optional)<input id="company" maxlength="200"></label>
<label>Title (optional)<input id="title" maxlength="200"></label>
<button id="save" type="submit">Confirm and save profile</button>
</form><p id="status" role="status" aria-live="polite"></p>
<script type="module" src="popup.js"></script></body></html>
